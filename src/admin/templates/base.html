<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}remember 管理{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, sans-serif; margin: 0; padding: 1.5rem;
           line-height: 1.5; max-width: 1100px; margin-inline: auto; }
    h1 { font-size: 1.4rem; } h2 { font-size: 1.1rem; margin-top: 2rem; }
    table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
    th, td { border: 1px solid #8884; padding: 0.35rem 0.5rem; text-align: left; }
    th { background: #8881; }
    .num { text-align: right; font-variant-numeric: tabular-nums; }
    .muted { color: #888; }
    .pill { padding: 0.05rem 0.4rem; border-radius: 0.6rem; font-size: 0.8rem; }
    .s-done { background: #2e7d3233; } .s-error { background: #c6282833; }
    .s-running { background: #f9a82533; } .s-queued { background: #1e88e533; }
    .left { color: #c62828; }
    nav { display: flex; gap: 1rem; margin-bottom: 1rem; font-size: 0.9rem; }
    .cards { display: flex; gap: 1rem; flex-wrap: wrap; }
    .card { border: 1px solid #8884; border-radius: 0.5rem; padding: 0.8rem 1rem; }
    .card .big { font-size: 1.5rem; font-weight: 600; }
    form.login { max-width: 320px; margin: 4rem auto; display: flex;
                 flex-direction: column; gap: 0.75rem; }
    input[type=password] { padding: 0.5rem; font-size: 1rem; }
    button { padding: 0.5rem; font-size: 1rem; cursor: pointer; }
    .err { color: #c62828; }
  </style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
