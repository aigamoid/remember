services:
  # メタデータDB（メッセージ・チャンク・取り込みジョブキュー）
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: oracle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oracle}
      POSTGRES_DB: oracle
    ports:
      - "5432:5432"   # ホストからの手動スクリプト・テスト実行用
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  # バッチパイプライン手動実行用（dry_run / crawler / chunker / contextualizer / exporter / indexer）
  oracle:
    build: .
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: postgresql://oracle:${POSTGRES_PASSWORD:-oracle}@postgres:5432/oracle
    volumes:
      - ./config.yml:/app/config.yml:ro
      - ./data:/app/data
    depends_on:
      - postgres

  # ベクトルDB
  qdrant:
    image: qdrant/qdrant:v1.16.1
    ports:
      - "6333:6333"
    volumes:
      - ./data/qdrant:/qdrant/storage

  # RAG回答APIサーバ
  api:
    build: .
    command: uvicorn src.api:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: postgresql://oracle:${POSTGRES_PASSWORD:-oracle}@postgres:5432/oracle
      # Bot→API 共有シークレット（OI-45）。.env で設定すると /chat・/remember を認証必須化。
      ORACLE_API_TOKEN: ${ORACLE_API_TOKEN:-}
    volumes:
      - ./config.yml:/app/config.yml:ro
      - ./data:/app/data
    ports:
      # 既定はホスト localhost のみ公開（外部到達を防ぐ・OI-45）。
      # 外部公開する場合は gateway/auth/rate-limit を別途用意すること。
      - "127.0.0.1:8000:8000"
    depends_on:
      - qdrant
      - postgres

  # 管理者向けポータル（利用量・コスト・サーバー/ジョブ状況の閲覧）
  # 認証は .env の ADMIN_PASSWORD。公開APIとは別ポート・別サービスで分離する。
  admin:
    build: .
    command: uvicorn src.admin.app:app --host 0.0.0.0 --port 8001
    env_file: .env
    environment:
      DATABASE_URL: postgresql://oracle:${POSTGRES_PASSWORD:-oracle}@postgres:5432/oracle
    volumes:
      - ./config.yml:/app/config.yml:ro
      - ./data:/app/data
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      - postgres

  # 取り込みワーカー（ingest_jobsキューを処理・定期sync）
  worker:
    build: .
    command: python worker.py
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: postgresql://oracle:${POSTGRES_PASSWORD:-oracle}@postgres:5432/oracle
    volumes:
      - ./config.yml:/app/config.yml:ro
      - ./data:/app/data
    depends_on:
      - postgres
      - qdrant

  # Discord Bot（れみちゃん）
  bot:
    build:
      context: .
      dockerfile: moimoichan_Discordbot/Dockerfile
    env_file: .env
    environment:
      ORACLE_API_URL: http://api:8000
      ORACLE_API_TOKEN: ${ORACLE_API_TOKEN:-}
      DATABASE_URL: postgresql://oracle:${POSTGRES_PASSWORD:-oracle}@postgres:5432/oracle
    volumes:
      - ./moimoichan_Discordbot/config.yml:/app/config.yml:ro
    depends_on:
      - api
      - postgres
